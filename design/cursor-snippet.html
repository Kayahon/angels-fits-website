<!-- Angel's Fits: trailing cursor ring.
     Site-wide code, added in WordPress with the free WPCode plugin
     (Code Snippets > Add Snippet > HTML Snippet > Site Wide Footer).
     Desktop only: hidden on phones/tablets and for visitors who turn off motion. -->
<style>
  .af-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    border: 1.5px solid #B0532C;
    border-radius: 999px;
    pointer-events: none;
    z-index: 99999;
    opacity: 0;
    transition: width 0.3s ease, height 0.3s ease, margin 0.3s ease, background-color 0.3s ease, opacity 0.3s ease;
    will-change: transform;
  }
  .af-cursor.is-on { opacity: 0.85; }
  .af-cursor.is-hover {
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    background-color: rgba(176, 83, 44, 0.12);
  }
  .af-cursor.is-down {
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
  }
  @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
    .af-cursor { display: none; }
  }
</style>
<div class="af-cursor" aria-hidden="true"></div>
<script>
  (function () {
    var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ring = document.querySelector('.af-cursor');
    if (!ring || !fine || still) return;

    var mouseX = 0, mouseY = 0, x = 0, y = 0;
    var ease = 0.14; /* lower = longer, softer delay */

    document.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      ring.classList.add('is-on');
    });
    document.addEventListener('mouseleave', function () { ring.classList.remove('is-on'); });
    document.addEventListener('mousedown', function () { ring.classList.add('is-down'); });
    document.addEventListener('mouseup', function () { ring.classList.remove('is-down'); });
    document.addEventListener('mouseover', function (e) {
      var target = e.target.closest('a, button, summary, input, select, textarea, label');
      ring.classList.toggle('is-hover', !!target);
    });

    function tick() {
      x += (mouseX - x) * ease;
      y += (mouseY - y) * ease;
      ring.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
